<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle dark -->
  <circle cx="128" cy="128" r="120" fill="#1E1E1E"/>

  <!-- Folder left (source) -->
  <g transform="translate(30, 90)">
    <path d="M 0 8 L 0 40 L 40 40 L 40 8 L 20 8 L 15 0 L 0 0 Z" fill="#3F3F46" stroke="#0E639C" stroke-width="2"/>
  </g>

  <!-- Arrow (movement) -->
  <g transform="translate(90, 105)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#0E639C" stroke-width="4"/>
    <polygon points="40,10 30,5 30,15" fill="#0E639C"/>
  </g>

  <!-- Folder right (destination) -->
  <g transform="translate(150, 90)">
    <path d="M 0 8 L 0 40 L 40 40 L 40 8 L 20 8 L 15 0 L 0 0 Z" fill="#2D7230" stroke="#0E639C" stroke-width="2"/>
  </g>

  <!-- Shield icon (security) -->
  <g transform="translate(103, 150)">
    <path d="M 25 0 L 40 10 L 40 25 Q 40 40 25 50 Q 10 40 10 25 L 10 10 Z" fill="#0E639C" opacity="0.8"/>
    <text x="21" y="32" font-family="Arial" font-size="24" fill="#FFFFFF" font-weight="bold">S</text>
  </g>

  <!-- Outer circle border -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#0E639C" stroke-width="3"/>
</svg>
